name: 打包 Mac Intel(老MacAir)
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # pip缓存，减少每次安装依赖耗时
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: mac13-py-${{ hashFiles('requirements.txt') }}

      - name: Install python依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: PyInstaller打包
        run: |
          pyinstaller --onefile --noconsole main.py
          # 把main.py替换成你的程序入口文件
      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: mac-intel-app
          path: dist/
